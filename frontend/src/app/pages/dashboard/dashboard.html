<div class="dashboard-container">
  <div class="dashboard-card">
    <h1>Welcome!</h1>
    <p>You are successfully logged in.</p>

    <div class="dashboard-actions">
      @if (isTwoFactorEnabled() === true) {
        <p class="status-enabled">✓ Two-Factor Authentication is enabled</p>
      } @else if (isTwoFactorEnabled() === false) {
        <a routerLink="/two-factor-setup" class="btn btn-primary">Setup Two-Factor Authentication</a>
      }
      <button (click)="logout()" class="btn btn-secondary">Logout</button>
    </div>
  </div>
</div>
